<main class="p-6">

    <h2 class="text-4xl font-bold mb-6">Kontaktiere uns +31-613803782</h2>

<form action="https://formspree.io/f/xeogbnrv" method="POST" class="grid gap-4" onsubmit="return validateCaptcha();">
  <label class="text-white">
    Ihr Name:
    <input type="text" name="name" required class="p-2 rounded w-full bg-gray-800 text-white border border-gray-600" placeholder="Ihr Name">
  </label>
  <label class="text-white">
    Ihre E-Mail:
    <input type="email" name="email" required class="p-2 rounded w-full bg-gray-800 text-white border border-gray-600" placeholder="email@example.com">
  </label>
  <label class="text-white">
    Ihre Nachricht:
    <textarea name="message" required class="p-2 rounded w-full bg-gray-800 text-white border border-gray-600" placeholder="Ihre Nachricht..."></textarea>
  </label>
  <label class="text-white">
    Was ist 3 + 4? (Anti-Spam):
    <input type="text" id="captcha" required class="p-2 rounded w-full bg-gray-800 text-white border border-gray-600" placeholder="Antwort">
  </label>
  <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Absenden</button>
</form>
<script>
  function validateCaptcha() {
    const captcha = document.getElementById('captcha').value.trim();
    if (captcha !== '7') {
      alert('Bitte lösen Sie das CAPTCHA korrekt (3 + 4).');
      return false;
    }
    return true;
  }
</script>

<footer class="text-center text-sm text-gray-500 py-6 border-t border-gray-700">
  <div>
    <span id="datetime"></span> | Wetter: <span id="weather"></span>
  </div>
  <div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  function updateDateTime() {
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const date = now.toLocaleDateString('de-DE', options);
    const time = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('datetime').textContent = `${date}, ${time}`;
  }
  updateDateTime();
  setInterval(updateDateTime, 1000);
  document.getElementById('weather').textContent = 'Teilweise sonnig, 17°C';
</script>
