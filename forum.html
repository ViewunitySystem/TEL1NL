</head>
<body>

<header>
  <h1>Forum & Benutzerprofil</h1>
</header>

<main>
  <section id="loginSection">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="E-Mail" required />
      <input type="password" id="loginPassword" placeholder="Passwort" required />
      <button type="submit">Einloggen</button>
    </form>
    <h3>Passwort vergessen?</h3>
    <form id="resetForm">
      <input type="email" id="resetEmail" placeholder="E-Mail zur Rücksetzung" required />
      <button type="submit">Passwort zurücksetzen</button>
    </form>
    <h2>Registrierung</h2>
    <form id="registerForm">
      <input type="text" id="regName" placeholder="Benutzername" required />
      <input type="email" id="regEmail" placeholder="E-Mail" required />
      <input type="password" id="regPassword" placeholder="Passwort" required />
      <input type="text" id="regBio" placeholder="Über dich" />
      <input type="url" id="regAvatar" placeholder="Avatar Bild URL (optional)" />
      <button type="submit">Registrieren</button>
    </form>
  </section>

  <section id="forumSection" style="display:none;">
    <h2>Beitrag verfassen</h2>
    <form id="postForm">
      <input type="text" id="postTitle" placeholder="Titel" required />
      <textarea id="postContent" placeholder="Inhalt..." rows="6"></textarea>
      <button type="submit">Posten</button>
    </form>

    <h2>Alle Beiträge</h2>
    <div id="postsList"></div>
  </section>
</main>

<footer class="text-center text-sm text-gray-500 py-6 border-t border-gray-700">
  <div>
    <span id="datetime"></span> | Wetter: <span id="weather"></span>
  </div>
  <div>
    &copy; <span id="year"></span> TEL1.nl – Tell first to tell. Alle Rechte vorbehalten.
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  function updateDateTime() {
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const date = now.toLocaleDateString('de-DE', options);
    const time = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('datetime').textContent = `${date}, ${time}`;
  }
  updateDateTime();
  setInterval(updateDateTime, 1000);
  document.getElementById('weather').textContent = 'Teilweise sonnig, 17°C';
</script>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="forum.js"></script>
</body>
</html>
