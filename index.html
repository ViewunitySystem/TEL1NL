<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Annäherung an Null - Rust + WASM</title>
</head>
<body style="background:#000;color:#0f0;font-family:monospace;">
  <h1>Annäherung an Null</h1>
  <div id="output">Lade...</div>

  <script type="module">
    import init, { Rechner } from "./pkg/null_visualisierung.js";

    async function start() {
      await init();
      const rechner = new Rechner();
      const output = document.getElementById("output");

      function step() {
        const x = rechner.next();
        const n = rechner.get_n();
        output.innerHTML = `n = ${n}<br>x = ${x}`;
        requestAnimationFrame(step);
      }

      step();
    }

    start();
  </script>
</body>
</html>
